# EU AI Act — narrowed v1 crosswalk (B13).
#
# This is the DELIBERATELY NARROW, review-survivable subset of the EU AI Act
# crosswalk: the two controls where OpenWright's runtime evidence maps most
# defensibly onto a specific obligation, prepared as the artifact a named EU AI
# Act specialist reviews first (V16, paired with the outreach packet B17). It is
# intentionally smaller than the full eu_ai_act.yaml so the review surface is the
# strongest claims only, not the thin proxies (Art-13) or the still-circular
# limbs (bare Art-12).
#
# Scope chosen for defensibility:
#   * Art-14 IN-THE-LOOP — per-decision human approval is a crisp, observable
#     runtime fact (a decision is linked to an 'approved' human_approval).
#   * Art-26(6) RETENTION — the >=6-month log-retention commitment is a concrete,
#     cryptographically-attested deployer obligation, distinct from the circular
#     "it's in the log" framing of bare record-keeping.
#
# REVIEW STATUS: maintainer-authored, primary-source cited, pending a named
# specialist verdict (V16). Produces EVIDENCE of controls exercised, NOT a legal
# compliance/conformity determination.

crosswalk:
  id: eu-ai-act-v1
  title: "EU AI Act — narrowed v1 (review-survivable subset)"
  version: "1.0.0"
  source: "Regulation (EU) 2024/1689 (OJ L, 2024/1689, 12.7.2024)"
  reviewed_as_of: "2026-06-01"
  description: >
    The narrowed, specialist-review-ready subset of the EU AI Act crosswalk:
    Article 14 human oversight (in-the-loop, per-decision approval) and Article
    26(6) deployer log-retention. These are the two controls where runtime agent
    evidence maps most defensibly to a specific obligation. Use the full
    eu-ai-act crosswalk for broader (less review-hardened) coverage.
  disclaimer: >
    This crosswalk produces EVIDENCE that specific controls were exercised at
    runtime. It does NOT constitute legal compliance, certification, conformity
    assessment, or an audit opinion under the EU AI Act. Those determinations are
    reserved for qualified auditors, notified bodies, and counsel. This subset is
    prepared for specialist review (V16) and is not yet specialist-attested.

  controls:
    - id: art-14-human-oversight
      title: "Article 14 — Human oversight (in-the-loop, per-decision approval)"
      variant: in_the_loop
      requirement: >
        Every high-risk agent decision is linked to a recorded human-approval event
        whose oversight status is 'approved' — a natural person approved the
        decision before it took effect.
      citation:
        instrument: "Regulation (EU) 2024/1689"
        article: "14"
        paragraphs: ["1", "4"]
        url: "https://artificialintelligenceact.eu/article/14/"
        quote: >
          High-risk AI systems shall be designed and developed in such a way ...
          that they can be effectively overseen by natural persons during the
          period in which they are in use.
        effective_date: "2027-12-02"
      scope:
        kind: ["agent_decision"]
        risk_classification: ["high"]
      condition:
        type: linked
        link: approval_ref
        target:
          kind: ["human_approval"]
          oversight_status: ["approved"]
      empty_scope: insufficient_evidence
      rationale: >
        Per-decision approval is a crisp, observable runtime fact: the decision
        event carries an approval_ref to a human_approval whose status is approved.
        This is OpenWright's strongest single mapping and the natural first control
        for specialist review.

    - id: art-26-retention
      title: "Article 26(6) — Deployer log-retention commitment (>=6 months)"
      requirement: >
        Each high-risk decision carries a cryptographically-attested retention
        commitment (the substantive Art-26(6) bar being at least six months). The
        retention_until value is part of the signed Merkle leaf, so the commitment
        is tamper-evident, not merely declared.
      citation:
        instrument: "Regulation (EU) 2024/1689"
        article: "26"
        paragraphs: ["6"]
        url: "https://artificialintelligenceact.eu/article/26/"
        quote: >
          Deployers shall keep the logs automatically generated by that high-risk
          AI system ... for a period appropriate to the intended purpose of the
          high-risk AI system, of at least six months.
        effective_date: "2027-12-02"
        notes: >
          Verifying the retention *duration* (>= 6 months) is a predicate
          enhancement pending an engine date-difference op; today the attested
          retention commitment's existence is evidenced. Pending V16.
      scope:
        kind: ["agent_decision"]
        risk_classification: ["high"]
      condition:
        type: field
        path: "ledger.retention_until"
        op: exists
      empty_scope: insufficient_evidence
      rationale: >
        Retention is a concrete deployer obligation, distinct from the circular
        "it's in the log" framing of bare record-keeping; binding retention_until
        into the signed leaf makes the commitment itself tamper-evident.
