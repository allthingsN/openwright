# GDPR (Regulation (EU) 2016/679) crosswalk for OpenWright.
#
# This crosswalk maps OpenWright canonical events to obligations in Regulation
# (EU) 2016/679 (the "GDPR"), focused on automated individual decision-making
# (Art. 22) and the surrounding accountability, records, by-design, impact-
# assessment and breach-notification duties. It is maintainer-authored and
# cited, but it is NOT legal advice, a data-protection compliance determination,
# or a supervisory-authority / DPA assessment (R-01, C-03, A-05). Each control
# records the primary-source article it derives from and the date the text was
# reviewed (NFR-MNT-02).
#
# PENDING SPECIALIST REVIEW (V16): the article selections, scoping and predicate
# choices below are an engineering mapping and have NOT yet been reviewed by a
# qualified data-protection specialist / DPO. Whether Article 22 (or any other
# provision) applies to a given processing operation is a legal question.
#
# Quotes are verbatim from the consolidated article text (gdpr-info.eu, which
# reproduces OJ L 119, 4.5.2016); re-verify against EUR-Lex (CELEX 32016R0679)
# before relying on any clause. GDPR has applied since 25 May 2018 (Art. 99(2)).

crosswalk:
  id: gdpr
  title: "GDPR (Regulation (EU) 2016/679) — automated decision-making & accountability"
  version: "1.1.0"
  source: "Regulation (EU) 2016/679 (GDPR), OJ L 119, 4.5.2016 (CELEX 32016R0679)"
  reviewed_as_of: "2026-06-01"
  description: >
    Maps runtime agent evidence to GDPR safeguards around automated individual
    decision-making (Art. 22) and the related transparency/access provisions
    (Art. 13/15), plus the accountability principle (Art. 5(2)), records of
    processing (Art. 30), data protection by design and by default (Art. 25),
    the data protection impact assessment (Art. 35) and personal-data-breach
    notification (Art. 33). Covers the minimum required by FR-MAP-02/09.
  disclaimer: >
    This crosswalk produces EVIDENCE that specific controls were exercised at
    runtime. It does NOT constitute legal advice, a data-protection compliance
    determination, certification, or a supervisory-authority (DPA) assessment
    under the GDPR. Whether Article 22 or any other provision applies to a given
    processing operation is a legal question reserved for counsel / a DPO, and
    this mapping is pending qualified specialist review (V16).

  controls:
    # -- Article 22: solely-automated decisions & the human safeguard ---------
    - id: art-22-human-intervention
      title: "Article 22(3) — Right to obtain human intervention (not solely automated)"
      requirement: >
        Each high-risk decision is linked to a recorded human-approval event
        whose oversight status is 'approved', evidencing that human intervention
        was applied — i.e. the decision was not based solely on automated
        processing without a human safeguard.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "22"
        paragraphs: ["1", "3"]
        url: "https://gdpr-info.eu/art-22-gdpr/"
        quote: >
          The data subject shall have the right not to be subject to a decision
          based solely on automated processing, including profiling, which
          produces legal effects concerning him or her or similarly significantly
          affects him or her ... the data controller shall implement suitable
          measures to safeguard the data subject's rights and freedoms and
          legitimate interests, at least the right to obtain human intervention
          on the part of the controller, to express his or her point of view and
          to contest the decision.
        effective_date: "2018-05-25"
      scope:
        kind: ["agent_decision"]
        risk_classification: ["high"]
      condition:
        type: linked
        link: approval_ref
        target:
          kind: ["human_approval"]
          oversight_status: ["approved"]
      empty_scope: insufficient_evidence
      rationale: >
        Art. 22(3) is the load-bearing safeguard for automated decisions: an
        unapproved high-risk decision (one with no linked approved human_approval)
        is exactly the "solely automated" case the right protects against, so it
        must surface as not_satisfied rather than passing silently.

    - id: art-13-22-logic
      title: "Article 13(2)(f) — Meaningful information about the logic involved"
      requirement: >
        Each agent decision records information enabling a meaningful description
        of the logic involved — the responding model, a recorded rationale
        reference, or an output reference.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "13"
        paragraphs: ["2(f)"]
        url: "https://gdpr-info.eu/art-13-gdpr/"
        quote: >
          the existence of automated decision-making, including profiling,
          referred to in Article 22(1) and (4) and, at least in those cases,
          meaningful information about the logic involved, as well as the
          significance and the envisaged consequences of such processing for the
          data subject.
        effective_date: "2018-05-25"
      scope:
        kind: ["agent_decision"]
      condition:
        type: any_of
        conditions:
          - { type: field, path: "model.response_model", op: exists }
          - { type: field, path: "risk.rationale_ref", op: exists }
          - { type: field, path: "io.output_ref", op: exists }
      empty_scope: insufficient_evidence

    - id: art-15-22-access
      title: "Article 15(1)(h) — Access to the logic of automated decisions"
      requirement: >
        The recorded evidence for each high-risk decision is committed to the
        tamper-evident ledger and carries a retention commitment, so it remains
        available to answer a data-subject access request about the automated
        decision.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "15"
        paragraphs: ["1(h)"]
        url: "https://gdpr-info.eu/art-15-gdpr/"
        quote: >
          the existence of automated decision-making, including profiling,
          referred to in Article 22(1) and (4) and, at least in those cases,
          meaningful information about the logic involved, as well as the
          significance and the envisaged consequences of such processing for the
          data subject.
        effective_date: "2018-05-25"
      scope:
        kind: ["agent_decision"]
        risk_classification: ["high"]
      condition:
        type: all_of
        conditions:
          - { type: committed }
          - { type: field, path: "ledger.retention_until", op: exists }
      empty_scope: insufficient_evidence

    # -- Article 5(2): accountability (demonstrable compliance) ---------------
    - id: art-5-2-accountability
      title: "Article 5(2) — Accountability (able to demonstrate compliance)"
      requirement: >
        Every recorded processing event is committed to the append-only,
        tamper-evident ledger, so the controller can demonstrate — with an
        inclusion proof — that the processing happened as logged. Because
        accountability is a completeness duty, a self-attested evidence gap
        defeats it.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "5"
        paragraphs: ["2"]
        url: "https://gdpr-info.eu/art-5-gdpr/"
        quote: >
          The controller shall be responsible for, and be able to demonstrate
          compliance with, paragraph 1 ('accountability').
        effective_date: "2018-05-25"
      scope:
        kind: ["llm_call", "tool_call", "agent_decision", "human_approval", "risk_classification", "policy_decision", "incident"]
      condition:
        type: committed
      empty_scope: insufficient_evidence
      # Accountability is a *completeness* obligation: a self-attested
      # evidence_gap marker (dropped/lost spans) means the controller cannot
      # fully demonstrate compliance, so the control cannot be satisfied while a
      # gap is attested (U1, V8).
      completeness_sensitive: true
      rationale: >
        The append-only Merkle ledger is the demonstration mechanism; an event's
        presence in it (with an inclusion proof) is the evidence. Because the log
        self-attests its own gaps, an attested evidence_gap downgrades this
        control rather than passing silently.

    # -- Article 30: records of processing activities -------------------------
    - id: art-30-records-processing
      title: "Article 30(1) — Records of processing activities (provenance)"
      requirement: >
        Each agent decision is attributable to a processing activity: it records
        the task provenance (task_id) and the source format it was ingested
        from, so the operation can be located in the controller's record of
        processing activities.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "30"
        paragraphs: ["1"]
        url: "https://gdpr-info.eu/art-30-gdpr/"
        quote: >
          Each controller and, where applicable, the controller's representative,
          shall maintain a record of processing activities under its
          responsibility.
        effective_date: "2018-05-25"
        notes: >
          Art. 30 governs the documentary record of processing activities; this
          control evidences that each logged decision is attributable to a task
          and source, not that a complete Art. 30 register exists (a legal/DPO
          artefact outside the event stream).
      scope:
        kind: ["agent_decision"]
      condition:
        type: all_of
        conditions:
          - { type: field, path: "provenance.task_id", op: exists }
          - { type: field, path: "source.format", op: exists }
      empty_scope: insufficient_evidence

    # -- Article 25: data protection by design and by default ----------------
    - id: art-25-data-protection-by-design
      title: "Article 25(1) — Data protection by design and by default (minimisation)"
      requirement: >
        Each high-risk decision evidences data-minimisation by design: I/O is
        held by reference (an output_ref hash/pointer, never an inline raw
        payload, DR-02) and a retention-until commitment bounds storage
        (storage limitation, Art. 5(1)(e)).
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "25"
        paragraphs: ["1"]
        url: "https://gdpr-info.eu/art-25-gdpr/"
        quote: >
          the controller shall ... implement appropriate technical and
          organisational measures, such as pseudonymisation, which are designed
          to implement data-protection principles, such as data minimisation, in
          an effective manner and to integrate the necessary safeguards into the
          processing in order to meet the requirements of this Regulation and
          protect the rights of data subjects.
        effective_date: "2018-05-25"
      scope:
        kind: ["agent_decision"]
        risk_classification: ["high"]
      condition:
        type: all_of
        conditions:
          - { type: field, path: "io.output_ref", op: exists }
          - { type: field, path: "ledger.retention_until", op: exists }
      empty_scope: insufficient_evidence

    # -- Article 35: data protection impact assessment (DPIA) -----------------
    - id: art-35-dpia
      title: "Article 35(1) — Data protection impact assessment (DPIA reference)"
      requirement: >
        Each high-risk decision shares a task context with a recorded
        risk-classification event that references an impact assessment (a DPIA /
        fundamental-rights impact assessment), evidencing that a prior assessment
        was carried out for the high-risk processing.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "35"
        paragraphs: ["1"]
        url: "https://gdpr-info.eu/art-35-gdpr/"
        quote: >
          Where a type of processing in particular using new technologies ... is
          likely to result in a high risk to the rights and freedoms of natural
          persons, the controller shall, prior to the processing, carry out an
          assessment of the impact of the envisaged processing operations on the
          protection of personal data.
        effective_date: "2018-05-25"
        notes: >
          The DPIA reference is recorded on the risk_classification event as
          attributes.fria_ref (the same reference also evidences an EU AI Act
          Art. 27 FRIA where applicable); a DPIA is required only for processing
          likely to result in a high risk (Art. 35(1), (3)).
      scope:
        kind: ["agent_decision"]
        risk_classification: ["high"]
      condition:
        type: linked
        link: same_context
        target:
          kind: ["risk_classification"]
          has: ["attributes.fria_ref"]
      empty_scope: insufficient_evidence

    # -- Article 33: personal data breach notification ------------------------
    - id: art-33-breach-notification
      title: "Article 33(1) — Personal data breach notification (deadline + provenance)"
      requirement: >
        Every recorded incident carries the task provenance back to its root
        task and records the notification deadline window that applies, so the
        controller can evidence the without-undue-delay / 72-hour notification
        duty to the supervisory authority.
      citation:
        instrument: "Regulation (EU) 2016/679"
        article: "33"
        paragraphs: ["1"]
        url: "https://gdpr-info.eu/art-33-gdpr/"
        quote: >
          In the case of a personal data breach, the controller shall without
          undue delay and, where feasible, not later than 72 hours after having
          become aware of it, notify the personal data breach to the supervisory
          authority competent in accordance with Article 55, unless the personal
          data breach is unlikely to result in a risk to the rights and freedoms
          of natural persons.
        effective_date: "2018-05-25"
        notes: >
          Not every recorded incident is a 'personal data breach' under Art. 4(12);
          this control evidences that incidents are logged with the provenance and
          a deadline window needed to support a timely notification decision.
      scope:
        kind: ["incident"]
      condition:
        type: all_of
        conditions:
          - { type: field, path: "provenance.root_task_id", op: exists }
          - { type: field, path: "attributes.report_deadline_days", op: exists }
      empty_scope: insufficient_evidence
